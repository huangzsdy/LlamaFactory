### model
model_name_or_path: /home/hzs/260304/models/Qwen/Qwen2.5-7B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
dataset: general_corpus,wiki_paraphrase,wikipedia,qa_pairs
template: qwen3
cutoff_len: 2048
max_samples: {"general_corpus": 55000, "wiki_paraphrase": 20000, "wikipedia": 5000, "qa_pairs": 10000}

preprocessing_num_workers: 4
dataloader_num_workers: 4

### output
output_dir: saves/qwen2.5-7b/lora/sft_mixed_custom
logging_steps: 10

# ============ 减少checkpoint的关键配置 ============
save_steps: 2000              # 每2000步保存一次（进一步减少保存频率）
save_total_limit: 1           # 只保留1个最新checkpoint（最少化存储）
save_only_model: true         # 只保存模型权重，不保存优化器状态（大幅减少存储）

plot_loss: true
overwrite_output_dir: true

report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
use_cpu: false
ddp_timeout: 180000000
resume_from_checkpoint: null

